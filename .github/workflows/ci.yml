name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build shared packages
        run: npm run build:packages

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/nodara"

      - name: Typecheck backend
        run: npm run typecheck -w apps/backend

      - name: Typecheck frontend
        run: npm run typecheck -w apps/frontend

      - name: Run package + backend tests
        run: |
          npm run test -w packages/utils
          npm run test -w packages/keeperhub
          npm run test -w apps/backend
