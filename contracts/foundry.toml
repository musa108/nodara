[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "C:/Users/sysadmin/.svm/0.8.26/solc-0.8.26.exe"
optimizer = true
optimizer_runs = 200
via_ir = false

[profile.default.fuzz]
runs = 500

[rpc_endpoints]
botchain_mainnet = "${RPC_URL_BOTCHAIN}"

# scan.botchain.ai runs Blockscout (confirmed via its own footer
# attribution), not an Etherscan-family explorer. Verification is done
# via `forge verify-contract --verifier blockscout ...` — see
# contracts/README.md for the exact command. No [etherscan] table is
# needed for Blockscout verification.
